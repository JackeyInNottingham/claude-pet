<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Claude Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="pet-canvas" width="256" height="256"></canvas>
  <div id="speech-bubble" class="speech-bubble hidden"></div>
  <div id="permission-dialog" class="permission-dialog hidden">
    <div class="permission-title"></div>
    <div class="permission-body">
      <pre class="permission-detail"></pre>
    </div>
    <div class="permission-buttons"></div>
  </div>
  <div id="update-dialog" class="update-dialog hidden">
    <div class="update-title"></div>
    <div class="update-body">
      <div class="update-version"></div>
      <pre class="update-notes"></pre>
    </div>
    <div class="update-buttons">
      <button class="update-option update-btn update-option-primary">Update</button>
      <button class="update-option update-skip-btn">Skip</button>
    </div>
  </div>
  <script src="sprites.js"></script>
  <script src="state-machine.js"></script>
  <script src="speech-bubble.js"></script>
  <script src="permission-format.js"></script>
  <script src="permission-dialog.js"></script>
  <script src="update-dialog.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
