name: Release

# Build and publish platform-specific release packages when a tag is pushed.
# Each runner builds for its native platform + arch.
#
# Trigger: git tag v0.2.0 && git push --tags

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Build packages ──
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: darwin-arm64
          - os: windows-latest
            label: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package release
        shell: bash
        run: bash scripts/package-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*

  # ── Create Release from available artifacts ──
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      contents: write

    steps:
      - name: Check for artifacts
        id: check
        run: |
          echo "Build jobs may have partially completed — checking for artifacts to upload."

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: List artifacts
        run: |
          echo "Available artifacts:"
          ls -lh artifacts/ 2>/dev/null || echo "(none)"

      - name: Create Release
        if: hashFiles('artifacts/*') != ''
        uses: softprops/action-gh-release@v2
        with:
          name: "Claude Pet ${{ github.ref_name }}"
          body: |
            ## 🚀 安装

            ### macOS / Linux
            ```bash
            curl -fsSL https://raw.githubusercontent.com/JackeyInNottingham/claude-pet/${{ github.ref_name }}/install.sh | bash
            ```

            ### Windows (PowerShell)
            ```powershell
            iwr -UseBasicParsing https://raw.githubusercontent.com/JackeyInNottingham/claude-pet/${{ github.ref_name }}/install.ps1 | iex
            ```

            > 安装脚本自动检测平台，优先下载预打包 Release 包（含 Electron，无需 npm install）。下载失败自动回退到 git clone + npm install。

            ---
            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          files: artifacts/*
          generate_release_notes: true
